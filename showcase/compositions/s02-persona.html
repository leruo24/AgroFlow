<script>
(() => {
  // Crop rows, generated once (deterministic).
  ["#s02-p1", "#s02-p2", "#s02-p3"].forEach((sel) => {
    const plot = document.querySelector(sel);
    for (let r = 0; r < 6; r++) {

      plot.appendChild(row);

  });
  const tl = gsap.timeline({ paused: true });
  const E3 = "power3.out", IO = "power2.inOut";
  tl.set("#s02-ph", { opacity: 0 }, 0);
  tl.fromTo("#s02-who", { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.6, ease: E3 }, 0.3);

  tl.fromTo("#s02-v2", { color: "#253126" }, { color: "#b9473e", duration: 0.6 }, 9.0);
  tl.fromTo("#s02-ring", { opacity: 0, scale: 1.04, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: E3 }, 10.2);
  tl.fromTo("#s02-att", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: E3 }, 10.6);
