# Publishes the admin console and the mobile web app to GitHub Pages.
#
# THERE WAS NO DEPLOY WORKFLOW IN THIS REPO BEFORE THIS FILE. The brief asked
# for the mobile web app to be added "following the admin's existing deploy
# setup" - there wasn't one, so this creates both. See the report.
#
# Layout on the published site (https://leruo24.github.io/AgroFlow/):
#
#     /            -> the admin console and the public landing page
#     /app/        -> the mobile app as a web app, for iPhone users
#
# Both are static. Neither holds a secret: the Supabase anon key and the API
# base URL are public by design (RLS is what protects the data), and they are
# supplied as repository VARIABLES rather than secrets so they can be read
# back and corrected without being re-entered blind.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Deploying from a branch by hand is what makes this usable before main is
  # updated - e.g. to show a working link in a presentation.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` because cancelling a
# half-finished deploy can leave the site serving a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ---- Admin console (served at the site root) ----------------------
      - name: Install admin dependencies
        working-directory: apps/web/admin
        run: npm ci

      - name: Build admin
        working-directory: apps/web/admin
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_AGROFLOW_API_BASE: ${{ vars.VITE_AGROFLOW_API_BASE }}
          # Shown on the landing page's "Get the app" section. Each link is
          # hidden entirely when its variable is unset, so the page is
          # correct before the APK exists.
          VITE_DOWNLOADS_ANDROID_APK_URL: ${{ vars.VITE_DOWNLOADS_ANDROID_APK_URL }}
          VITE_DOWNLOADS_WEB_APP_URL: ${{ vars.VITE_DOWNLOADS_WEB_APP_URL }}
        run: npm run build

      - name: Collect the admin build
        run: |
          mkdir -p _site
          cp -r apps/web/admin/dist/. _site/

      # ---- Mobile web app (served at /app/) -----------------------------
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Build the mobile web app
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_AGROFLOW_API_BASE: ${{ vars.EXPO_PUBLIC_AGROFLOW_API_BASE }}
        run: npx expo export --platform web --output-dir dist-web

      - name: Collect the mobile build
        run: |
          mkdir -p _site/app
          cp -r apps/mobile/dist-web/. _site/app/

      # GitHub Pages serves a 404 for any path it has no file for. Expo
      # Router's web build is a single-page app, so a deep link like
      # /app/forecast would 404 on a hard refresh. Serving index.html as the
      # 404 page is the standard Pages workaround and makes those links work.
      - name: Make deep links work on Pages
        run: |
          cp _site/index.html _site/404.html
          cp _site/app/index.html _site/app/404.html || true

      # Pages will not serve a path starting with an underscore unless this
      # file is present (a Jekyll inheritance nobody wants here).
      - name: Disable Jekyll processing
        run: touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
