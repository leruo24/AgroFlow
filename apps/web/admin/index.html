<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AgroFlow — Administration Console</title>
  <meta name="description" content="AgroFlow platform administration console." />
</head>
<body>
  <!-- Everything this app ever shows lives inside #root, and only ever
       ONE of three mutually exclusive states at a time: loading,
       signed-out (login card), signed-in (the dashboard shell). See
       src/main.ts's render() - it always clears #root before building
       the next state into it, so there is no code path where two
       states' markup can coexist, and no CSS hide/overlay involved in
       switching between them. The div below is the "loading" state's
       markup, shown until the first real render() call (also "loading",
       explicitly, then whichever of the other two the session check
       resolves to) replaces it. -->
  <div id="root">
    <div class="boot-loading" aria-live="polite">Loading…</div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
