<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>AgroFlow staff sign-in</title>
  <!-- /admin/ is the Staff sign-in address. The console routes on the hash, so this forwards
       to the same site's #/admin; relative, so it works under a sub-path as well. -->
  <meta http-equiv="refresh" content="0; url=../#/admin" />
  <script>location.replace("../#/admin");</script>
  <style>body{font-family:system-ui,sans-serif;background:#f5f6f5;color:#253126;padding:24px}</style>
</head>
<body>
  <p><a href="../#/admin">Continue to staff sign-in</a></p>
</body>
</html>
